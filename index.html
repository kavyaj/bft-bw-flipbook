<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Whiteboard sketches drawn by the coaches at BFT Beauty World, one board per class.">
<meta property="og:title" content="The Coach's Playbook · BFT Beauty World">
<meta property="og:description" content="Whiteboards from the coaches at BFT Beauty World.">
<title>The Coach's Playbook</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Oswald:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --desk:#E7EAED; --desk-hi:#F2F4F6; --surface:#FFFFFF; --line:#D3D8DD;
  --board:#F8F9FA; --board-line:#E3E7EA;
  --ink:#1A1A1A; --ink-soft:#5A6168; --ink-faint:#949BA2;
  --charcoal:#1A1A1A; --on-dark:#F8F9FA; --on-dark-soft:#A3AAB0;
  --blue:#00A3E0; --blue-ink:#0A6C99; --coral:#FF5800; --marker:#23419E;
  --tape:rgba(255,232,178,.75);
  --head:"Oswald","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --hand:"Kalam","Comic Neue","Segoe Print","Bradley Hand",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--desk);color:var(--ink)}
body{font-family:var(--head);font-weight:400;min-height:100%;
  background:radial-gradient(1100px 620px at 50% 38%, var(--desk-hi) 0%, transparent 72%), var(--desk)}
button,select,a{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(242,244,246,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.bft{font-family:var(--head);font-weight:700;font-size:14px;letter-spacing:.06em;background:var(--blue);color:var(--charcoal);padding:3px 7px 2px;border-radius:3px}
.logo{height:26px;width:auto;display:block}
.brand b{font-weight:600;font-size:17px;letter-spacing:.05em;text-transform:uppercase}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.filters::-webkit-scrollbar{display:none}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;
  font-size:13px;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chip-btn .n{font-size:11px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.chip-btn:hover{border-color:var(--ink-soft)}
.chip-btn[aria-pressed="true"]{background:var(--charcoal);color:var(--on-dark);border-color:var(--charcoal)}
.chip-btn[aria-pressed="true"] .n{color:var(--on-dark-soft)}
.chip-btn .dot{width:8px;height:8px;border-radius:50%}
.sel-wrap{position:relative}
.sel-wrap select{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:7px 34px 7px 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;max-width:200px}
.sel-wrap::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink-soft);border-bottom:2px solid var(--ink-soft);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--coral);color:var(--charcoal);text-decoration:none;
  font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:6px;white-space:nowrap}
.cta:hover{filter:brightness(1.06)}
.cta svg{width:16px;height:16px}

/* ---------- stage ---------- */
.stage{max-width:1280px;margin:0 auto;padding:26px 20px 30px}
#book-wrap{position:relative;margin:0 auto;filter:drop-shadow(0 22px 28px rgba(26,26,26,.16))}
#book-wrap .stf__parent{margin:0 auto}
.rings{position:absolute;left:50%;top:0;width:30px;transform:translateX(-50%);z-index:20;pointer-events:none;
  display:flex;flex-direction:column;justify-content:space-around;padding:5% 0}
.rings i{display:block;height:10px;border-radius:6px;margin:0 2px;
  background:linear-gradient(180deg,#fdfdfd 0%,#aab1b7 45%,#626a70 62%,#d4d8dc 100%);box-shadow:0 2px 3px rgba(0,0,0,.25)}
.controls{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:20px}
.nav-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.nav-btn:hover{border-color:var(--ink)}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-btn svg{width:19px;height:19px}
.counter{letter-spacing:.12em;text-transform:uppercase;font-size:13px;min-width:170px;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.counter b{color:var(--ink);font-weight:500}

/* ---------- pages ---------- */
.page{background:var(--board);color:var(--ink);overflow:hidden;container-type:inline-size}
.stf__block button *, .stf__block a *{pointer-events:none}
.pg{position:relative;height:100%;display:flex;flex-direction:column;padding:10cqw 10cqw 9cqw}
.pg-left{box-shadow:inset -16px 0 22px -18px rgba(0,0,0,.22)}
.pg-right{box-shadow:inset 16px 0 22px -18px rgba(0,0,0,.22)}

.meta-row{display:flex;justify-content:space-between;align-items:center;gap:3cqw}
.tags{display:flex;gap:1.8cqw;flex-wrap:wrap}
.tag{font-weight:600;font-size:2.9cqw;letter-spacing:.14em;text-transform:uppercase;padding:1.1cqw 2.4cqw .9cqw;border-radius:.8cqw;color:var(--charcoal)}
.tag.cat-Cardio{background:var(--coral)}
.tag.cat-Strength{background:var(--blue)}
.tag.cat-HIIT{background:var(--charcoal);color:var(--on-dark)}
.tag.cat-Hybrid{background:linear-gradient(90deg,var(--coral) 0 50%,var(--blue) 50% 100%)}
.tag.prog{background:transparent;color:var(--ink-soft);padding-inline:0;letter-spacing:.12em;font-weight:500}
.date{font-family:var(--hand);font-size:3.9cqw;color:var(--ink-soft);white-space:nowrap}
.prog-name{font-weight:600;text-transform:uppercase;font-size:7cqw;line-height:1;letter-spacing:.04em;margin:9cqw 0 0;text-wrap:balance}
.quip{font-family:var(--hand);font-size:6.2cqw;line-height:1.3;color:var(--marker);margin:4cqw 0 0;text-wrap:balance}
.quip::before{content:"\201C"}.quip::after{content:"\201D"}
.note{font-size:3.7cqw;line-height:1.55;letter-spacing:.02em;color:var(--ink-soft);margin:5cqw 0 0;max-width:40ch}
.grow{flex:1}
.coach-row{display:flex;align-items:center;gap:3.5cqw;background:none;border:0;padding:0;text-align:left}
.coach-row .who{display:flex;flex-direction:column;gap:.6cqw}
.coach-row .drawn{font-family:var(--hand);font-size:3.4cqw;color:var(--ink-faint);line-height:1}
.coach-row .c-name{font-weight:600;font-size:4.8cqw;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.coach-row .c-link{font-size:3cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-ink)}
.coach-row:hover .c-name{text-decoration:underline;text-underline-offset:.8cqw}
.avatar{width:12cqw;height:12cqw;flex:none;border-radius:50%;display:grid;place-items:center;overflow:hidden;
  font-weight:600;font-size:4.6cqw;color:var(--charcoal)}
.avatar img{width:100%;height:100%;object-fit:cover}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:6cqw;padding-top:4cqw;border-top:1px solid var(--board-line)}
.txt-btn{display:inline-flex;align-items:center;gap:1.6cqw;background:none;border:0;padding:0;text-decoration:none;
  font-size:3.2cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.txt-btn svg{width:3.6cqw;height:3.6cqw}
.txt-btn:hover{color:var(--ink)}
.txt-btn.hot{color:var(--coral);font-weight:600}
.txt-btn.hot:hover{color:#D94A00}

/* sketch page */
.pg-right.sk{justify-content:center;align-items:center;padding:7cqw}
.sketch{position:relative;display:block;width:88%;border:0;padding:0;background:#fff;transform:rotate(-.6deg);
  box-shadow:0 1cqw 2.6cqw rgba(0,0,0,.16),0 .2cqw .5cqw rgba(0,0,0,.14);cursor:zoom-in}
.sketch img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.sketch::before,.sketch::after{content:"";position:absolute;top:-2.4cqw;width:20cqw;height:5.5cqw;background:var(--tape)}
.sketch::before{left:-4cqw;transform:rotate(-28deg)}
.sketch::after{right:-4cqw;transform:rotate(26deg)}

/* cover + back */
.pg-cover{background:var(--charcoal);color:var(--on-dark);padding:12cqw 11cqw}
.cover-top{display:flex;align-items:center;gap:2.6cqw;letter-spacing:.22em;text-transform:uppercase;font-size:3.2cqw;color:var(--on-dark-soft)}
.cv-logo{height:9cqw;width:auto;display:block}
.cover-title{font-weight:700;text-transform:uppercase;font-size:15cqw;line-height:.92;margin:auto 0 0;letter-spacing:-.005em}
.cover-title em{font-style:normal;color:var(--blue)}
.cover-sub{font-family:var(--hand);font-size:4.8cqw;line-height:1.35;color:var(--on-dark-soft);margin:5cqw 0 0}
.cover-open{margin-top:auto;font-family:var(--hand);font-size:3.8cqw;color:var(--on-dark-soft);align-self:flex-end}
.pg-back .big{font-weight:700;text-transform:uppercase;font-size:13cqw;line-height:.95;margin:auto 0 0}
.pg-back .big span{color:var(--coral)}
.pg-back .small{font-size:3.5cqw;line-height:1.5;color:var(--on-dark-soft);margin:4cqw 0 0;letter-spacing:.03em}
.btn-hot{display:inline-flex;align-items:center;gap:2cqw;align-self:flex-start;margin-top:7cqw;background:var(--coral);color:var(--charcoal);
  text-decoration:none;font-weight:600;font-size:4cqw;letter-spacing:.1em;text-transform:uppercase;padding:3cqw 4.6cqw 2.7cqw;border-radius:1.2cqw}
.btn-hot svg{width:4.4cqw;height:4.4cqw}
.pg-back .addr{margin-top:auto;font-family:var(--hand);font-size:3.6cqw;color:var(--on-dark-soft)}

/* intro + roster */
.eyebrow{font-size:3cqw;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint)}
.intro-h{font-weight:700;text-transform:uppercase;font-size:10cqw;line-height:.98;margin:auto 0 0;text-wrap:balance}
.intro-p{font-family:var(--hand);font-size:4.6cqw;line-height:1.45;color:var(--ink-soft);margin:5cqw 0 0;max-width:30ch}
.intro-p + .intro-p{margin-top:2cqw}
.intro-left .grow{flex:1.2}
.roster{display:grid;grid-template-columns:repeat(4,1fr);gap:5cqw 2cqw;margin-top:7cqw;align-content:start}
.roster button{display:flex;flex-direction:column;align-items:center;gap:1.8cqw;background:none;border:0;padding:0;min-width:0}
.roster .avatar{width:13cqw;height:13cqw;font-size:5cqw;transition:transform .15s}
.roster .nm{font-size:3cqw;letter-spacing:.08em;text-transform:uppercase;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roster button:hover .avatar{transform:translateY(-.6cqw)}
.roster-h{display:flex;justify-content:space-between;align-items:baseline}
.roster-h .cnt{font-family:var(--hand);font-size:3.8cqw;color:var(--ink-faint)}
.empty{font-family:var(--hand);font-size:5cqw;color:var(--ink-soft);margin-top:6cqw}

/* ---------- mobile stack ---------- */
#stack{display:grid;gap:22px;max-width:520px;margin:0 auto}
.card{background:var(--board);border-radius:4px;overflow:hidden;box-shadow:0 10px 24px rgba(26,26,26,.12);scroll-margin-top:120px}
.card .pg{height:auto;box-shadow:none}
.card-fig{padding:9cqw 7cqw 2cqw;display:flex;justify-content:center;container-type:inline-size}
.card-info{container-type:inline-size}
.card-info .pg{padding:5cqw 8cqw 6cqw}
.card-info .prog-name{margin-top:6cqw;font-size:7cqw}
.card-info .grow{flex:none;height:6cqw}
.card-cover{border-radius:4px;overflow:hidden;container-type:inline-size;box-shadow:0 10px 24px rgba(26,26,26,.18)}
.card-cover .pg{height:auto;min-height:90cqw}
.card-roster{container-type:inline-size}
.card-roster .pg{padding:8cqw}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.92);display:flex;flex-direction:column;color:var(--on-dark)}
.ov-bar{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.12)}
.ov-title{text-transform:uppercase;letter-spacing:.06em;font-size:17px;margin-right:auto}
.ov-title small{display:block;font-family:var(--hand);text-transform:none;letter-spacing:0;font-size:13px;color:var(--on-dark-soft)}
.ov-btn{border:1px solid rgba(255,255,255,.2);background:transparent;border-radius:6px;padding:7px 12px;display:inline-flex;align-items:center;gap:7px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-dark)}
.ov-btn[aria-pressed="true"]{background:var(--on-dark);color:var(--charcoal)}
.ov-btn svg{width:16px;height:16px}
.lb-scroll{flex:1;overflow:auto;display:grid;place-items:center;padding:16px}
.lb-scroll img{max-height:calc(100vh - 110px);max-width:100%;width:auto;cursor:zoom-in;background:#fff}
.lb-scroll.zoomed{place-items:start center}
.lb-scroll.zoomed img{max-height:none;max-width:none;width:min(1500px,190vw);cursor:zoom-out}
#overlay-profile{background:rgba(20,20,20,.55);padding:16px}
.profile-card{margin:auto;width:min(480px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--board);color:var(--ink);border-radius:4px;container-type:inline-size;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.profile-card .pg{padding:9cqw;height:auto}
.pf-close{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:2}
.pf-close svg{width:17px;height:17px}
.pf-head{display:flex;gap:5cqw;align-items:center}
.pf-head .avatar{width:22cqw;height:22cqw;font-size:8.5cqw}
.pf-head h2{font-weight:700;text-transform:uppercase;font-size:8.5cqw;line-height:1;margin:0}
.pf-role{font-family:var(--hand);font-size:4.2cqw;color:var(--ink-soft);margin-top:1.4cqw}
.pf-bio{font-size:4.1cqw;line-height:1.6;color:var(--ink-soft);margin:7cqw 0 0;letter-spacing:.015em}
.pf-facts{display:grid;grid-template-columns:1fr 1fr;gap:4cqw;margin:6cqw 0 0;padding:5cqw 0 0;border-top:1px solid var(--board-line)}
.pf-facts dt{font-size:2.8cqw;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.pf-facts dd{margin:1cqw 0 0;font-family:var(--hand);font-size:4.3cqw;color:var(--marker)}
.pf-actions{display:flex;gap:4cqw;flex-wrap:wrap;align-items:center;margin-top:7cqw}
.pf-actions .btn-hot{margin-top:0;font-size:3.6cqw}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;
  background:var(--charcoal);color:var(--on-dark);letter-spacing:.05em;padding:10px 16px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);word-break:break-all;font-size:14px}

.mode-book #stack{display:none}
.mode-stack #book-area{display:none}
.cta .short{display:none}
@media (max-width:640px){
  .bar{position:static}
  .bar-in{padding:10px 16px;gap:10px}
  .stage{padding:18px 16px 28px}
  .brand b{font-size:14px}
  .cta{padding:7px 10px;font-size:12px}
  .cta .long{display:none}.cta .short{display:inline}
  .filters{order:3;flex:1 1 0;min-width:0}
  .sel-wrap{order:4}
  .sel-wrap select{max-width:120px;font-size:12px;padding:7px 28px 7px 10px}
  .card{scroll-margin-top:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#top" data-action="home" aria-label="The Coach's Playbook, back to cover">
      <img class="logo" src="images/brand/bft-logo-cyan.svg" alt="BFT" width="48" height="26"><b>The Coach's Playbook</b>
    </a>
    <nav class="filters" id="filters" aria-label="Filter by workout type"></nav>
    <label class="sel-wrap">
      <select id="coach-select" aria-label="Filter by coach"></select>
    </label>
    <a class="cta" id="top-cta" target="_blank" rel="noopener"></a>
  </div>
</header>

<main class="stage" id="top">
  <section id="book-area" aria-label="Flipbook">
    <div id="book-wrap"><div class="rings" id="rings" aria-hidden="true"></div></div>
    <div class="controls">
      <button class="nav-btn" id="prev" aria-label="Previous page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="counter" id="counter" aria-live="polite"></div>
      <button class="nav-btn" id="next" aria-label="Next page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </section>
  <section id="stack" aria-label="Boards"></section>
</main>

<div class="overlay" id="overlay-lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="lb-title">
  <div class="ov-bar">
    <div class="ov-title" id="lb-title"></div>
    <button class="ov-btn" id="lb-orig" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>Original photo</button>
    <button class="ov-btn" id="lb-zoom" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3M11 8v6M8 11h6"/></svg>Zoom</button>
    <button class="ov-btn" data-action="close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>Close</button>
  </div>
  <div class="lb-scroll" id="lb-scroll"><img id="lb-img" alt=""></div>
</div>

<div class="overlay" id="overlay-profile" hidden role="dialog" aria-modal="true">
  <div class="profile-card" id="profile-card"></div>
</div>

<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
/* =====================================================================
   LIVE FEED BOOTSTRAP
   ---------------------------------------------------------------------
   data.js gives us the published boards + coach roster as a safe base.
   Here we fetch the same data live from the "BFT Playbook" Google
   Sheet (via its Apps Script web app), merge it on top of that base,
   and only then kick off rendering (window.__initPlaybook, in app.js).

   Merge rules:
     - Coaches match to the static roster by lowercased name, so a
       Sheet coach named "Jay" updates the existing coach-a entry in
       place (its id is kept, so legacy boards pointing at "coach-a"
       still resolve correctly) instead of creating a duplicate.
     - A Sheet coach whose name isn't in the static roster yet is
       appended as a new coach.
     - Only non-empty Sheet fields overwrite the static ones, so a
       coach's Sheet row can be filled in gradually.
     - Boards already published in data.js are kept as-is. Any live
       board from the Sheet ("Entries") is appended after them,
       skipping ids already present. A live board's free-text coach
       name is resolved against the same name map used above.
     - If the live feed can't be reached (offline, first load before
       the Apps Script deployment exists, etc.) the site still renders
       fine from data.js alone — the fetch failure is swallowed.
   ===================================================================== */
(function boot(){
  const LIVE_URL = "https://script.google.com/macros/s/AKfycbycSUPo_1S5GV2k7vyHKT1jJNsblNuEoTMFF99L3bnBFVwOQ-I1_xc8BxsVtEHV19wY/exec";
  const IMG = { page:"images/boards/", full:"images/full/", original:"images/original/" };
  const D = window.PLAYBOOK;

  // Normalize the static boards to the same page/full/original shape
  // that live boards use, so app.js never has to think about "file".
  D.boards.forEach(b=>{
    if (b.file && !b.page){ b.page = IMG.page+b.file; b.full = IMG.full+b.file; b.original = IMG.original+b.file; }
  });

  function nameKey(n){ return String(n||"").trim().toLowerCase(); }

  function mergeLive(live){
    const coachByName = {};
    D.coaches.forEach(c=>{ coachByName[nameKey(c.name)] = c; });

    (live.coaches||[]).forEach(lc=>{
      const key = nameKey(lc.name); if (!key) return;
      const existing = coachByName[key];
      if (existing){
        Object.keys(lc).forEach(k=>{
          if (k==="id") return; // keep the legacy id (e.g. coach-a) so old boards still resolve
          const v = lc[k];
          if (v!==undefined && v!==null && String(v).trim()!=="") existing[k]=v;
        });
      } else {
        const nc = Object.assign({}, lc);
        D.coaches.push(nc);
        coachByName[key] = nc;
      }
    });

    const existingIds = new Set(D.boards.map(b=>b.id));
    (live.boards||[]).forEach(lb=>{
      if (!lb.id || existingIds.has(lb.id)) return;
      const coachObj = coachByName[nameKey(lb.coach)];
      D.boards.push({
        id: lb.id,
        program: lb.program||"",
        progression: lb.progression||"",
        category: lb.category||"Hybrid",
        date: lb.date||"",
        coach: coachObj ? coachObj.id : (lb.coach||""),
        note: lb.note||"",
        quip: lb.quip||"",
        // smaller copy for the book page; full size is kept for the zoom view
        page: String(lb.image||"").replace("c_limit,w_1800", "c_limit,w_1000"),
        full: lb.image||"",
        original: lb.original||lb.image||"",
        transcript: lb.transcript||""
      });
      existingIds.add(lb.id);
    });
  }

  // Newest boards first, oldest last (dates are yyyy-mm-dd, so text order works)
  function sortNewestFirst(){
    D.boards.sort((a,b)=> (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
  }

  // The Google feed can take several seconds to answer, so we don't make
  // visitors wait for it. The last copy we got is kept in this browser and
  // used straight away; the fresh copy loads in the background. If it has
  // something new, a small "tap to refresh" note appears.
  const CACHE_KEY = "bft-playbook-live-v1";
  const WAIT_MS = 5000; // first-ever visit: wait this long for the feed, then show what we have
  let started = false;
  function start(){ if (started) return; started = true; sortNewestFirst(); window.__initPlaybook(); }
  function readCache(){ try { return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); } catch(e){ return null; } }
  function saveCache(live){ try { localStorage.setItem(CACHE_KEY, JSON.stringify(live)); } catch(e){} }
  function sig(live){ return live ? JSON.stringify([live.boards||[], live.coaches||[]]) : ""; }
  function offerRefresh(){
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = "New boards are in. Tap to refresh.";
    t.style.cursor = "pointer";
    t.onclick = () => location.reload();
    t.hidden = false;
  }

  const cached = readCache();
  let shown = null; // the feed copy the page is currently showing

  const fresh = fetch(LIVE_URL, {cache:"no-store"})
    .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP "+r.status)));

  fresh.then(live => {
    saveCache(live);
    if (!started){ mergeLive(live); shown = live; start(); }
    else if (sig(live) !== sig(shown)) offerRefresh();
  }).catch(err => {
    console.warn("Live feed unavailable, showing the saved/published boards only.", err);
    start();
  });

  if (cached){
    mergeLive(cached); shown = cached; start();
  } else {
    setTimeout(start, WAIT_MS);
  }
})();
</script>

</body>
</html>
